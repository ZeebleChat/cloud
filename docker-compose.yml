services:
  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: zcloud-postgres
    environment:
      POSTGRES_DB: zcloud_db
      POSTGRES_USER: zcloud_user
      POSTGRES_PASSWORD: zcloud_password
    ports:
      - "5433:5432"
    volumes:
      - zcloud_postgres_data:/var/lib/postgresql/data
    networks:
      - zcloud-net
    restart: unless-stopped

  # ── Zcloud (Cloud Server Service) ─────────────────────────────────────────────
  zcloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zcloud
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://zcloud_user:zcloud_password@postgres:5432/zcloud_db
      ZCLOUD_PUBLIC_URL: ${ZCLOUD_PUBLIC_URL:-https://cloud.zeeble.xyz}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 8003
      RUST_LOG: zcloud=info,tower_http=debug
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-zeeble-dev-key}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change-me-livekit-secret-min-32-chars}
    depends_on:
      - postgres
      - livekit
    networks:
      - zcloud-net
    restart: unless-stopped

  # ── LiveKit (Voice/Video) ─────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    command: --bind 0.0.0.0 --config /livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-zeeble-dev-key}: ${LIVEKIT_API_SECRET:-change-me-livekit-secret-min-32-chars}"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    networks:
      - zcloud-net
    restart: unless-stopped

networks:
  zcloud-net:
    driver: bridge

volumes:
  zcloud_postgres_data:
